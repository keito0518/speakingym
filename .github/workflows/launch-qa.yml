name: Launch regression and browser QA
on:
  push:
  pull_request:
jobs:
  launch-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs worker/*.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Desktop and mobile browser checks
        run: |
          python3 -m http.server 8765 >/tmp/server.log 2>&1 &
          node tests/browser-qa.cjs
          SPEAKINGYM_BROWSER_ENGINE=webkit node tests/browser-qa.cjs
          node tests/stripe-staging-browser-qa.cjs
          SPEAKINGYM_BROWSER_ENGINE=webkit node tests/stripe-staging-browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: qa-screenshots/
