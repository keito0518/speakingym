name: Speakingym AI Worker tests

on:
  pull_request:
    paths:
      - "worker/**"
      - "billing-ui.js"
      - "plans.html"
      - "tests/billing-ui.test.mjs"
      - "tests/reflex-content.test.mjs"
      - "reflex.html"
      - ".github/workflows/worker-tests.yml"
  push:
    paths:
      - "worker/**"
      - "billing-ui.js"
      - "plans.html"
      - "tests/billing-ui.test.mjs"
      - "tests/reflex-content.test.mjs"
      - "reflex.html"
      - ".github/workflows/worker-tests.yml"

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test the no-billing fallback and AI bridge
        run: node --test worker/*.test.mjs tests/billing-ui.test.mjs tests/reflex-content.test.mjs
