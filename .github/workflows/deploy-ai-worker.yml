name: Deploy Speakingym AI Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/ai-worker.js"
      - "worker/plan-limits.js"
      - "worker/wrangler.toml"
      - "worker/package.json"
      - "worker/ai-worker.test.mjs"
      - "worker/plan-limits.test.mjs"
      - ".github/workflows/deploy-ai-worker.yml"
  workflow_dispatch:

concurrency:
  group: speakingym-worker-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Worker before deploying
        run: node --test worker/ai-worker.test.mjs worker/plan-limits.test.mjs
      - name: Verify deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions repository secrets to enable automatic deployment."
            exit 1
          fi
      - name: Deploy existing Worker (preserve dashboard secrets)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml
