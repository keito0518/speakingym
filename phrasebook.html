<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="canonical" href="https://speakingym.pages.dev/phrasebook.html">
<script src="./analytics-config.js"></script><script src="./analytics-loader.js"></script><title>共通フレーズ帳 | Speakingym</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f8f3;color:#203e30;font:15px/1.7 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px 18px 70px}a{color:#286244}h1{font-size:30px}button,select{font:inherit;padding:10px;border:1px solid #cbdaca;border-radius:9px;background:white;color:#244b35;max-width:100%}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #e68d61}nav,.filters,.actions{display:flex;flex-wrap:wrap;gap:10px}article{padding:20px;background:white;border:1px solid #dae4d6;border-radius:16px;margin-top:15px;overflow-wrap:anywhere}article p{margin:9px 0}.english{font-size:20px;font-weight:700}small{color:#5e745f}.filters{margin:20px 0}.hint{color:#5e745f}select{min-height:44px}[hidden]{display:none!important}</style>
<main><nav><a href="./account.html">← マイページ</a><a href="./reflex.html">60秒チャレンジ</a><a href="./scenes.html">AI実践英会話</a></nav><h1>覚えておきたい英語を、ひとつに。</h1><p>回答例、AIとの会話、自然な言い換え、AI先生の改善表現をまとめて復習。</p><p class="hint">保存ボタンで選んだ表現のみ表示します。ログイン時は既存の学習記録と同じ仕組みで同期します。会話全体の自動保存はしません。</p>
<div class="filters"><label>保存元 <select id="source"><option value="">すべて</option></select></label><label>難易度 <select id="level"><option value="">すべて</option><option value="easy">基礎</option><option value="standard">標準</option><option value="challenge">応用</option><option value="unknown">未設定（以前の保存）</option></select></label><label>カテゴリ <select id="category"><option value="">すべて</option></select></label><button id="hide" type="button" aria-pressed="false">英語を隠して復習</button></div><p id="count" role="status"></p><div id="phrases"></div></main>
<script src="./speech-settings.js"></script><script src="./phrasebook.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let hidden=false;const api=window.speakingymPhrases;function options(id,values){const el=$(id),selected=el.value;el.replaceChildren(new Option('すべて',''));for(const v of new Set(values))el.add(new Option(({challenge:'60秒チャレンジ',conversation:'AI英会話',cafe:'カフェ',hotel:'ホテル',restaurant:'レストラン',shopping:'買い物',airport:'空港',smalltalk:'雑談'})[v]||v,v));el.value=selected}function render(){const all=api.list();options('source',all.map(p=>p.source));options('category',all.map(p=>p.category));const items=all.filter(p=>(!$('source').value||p.source===$('source').value)&&(!$('level').value||p.level===$('level').value)&&(!$('category').value||p.category===$('category').value));$('count').textContent=items.length+' / '+all.length+'表現';const root=$('phrases');root.replaceChildren();if(!items.length){const p=document.createElement('p');p.textContent=all.length?'条件に合う表現がありません。絞り込みを変更してみよう。':'まだ保存フレーズがないよ。60秒チャレンジの回答例やAI英会話・AI先生の表現で「保存」を押してみよう。';root.append(p)}for(const p of items){const card=document.createElement('article');const meta=document.createElement('small');meta.textContent=p.source+' · '+({easy:'基礎',standard:'標準',challenge:'応用',unknown:'難易度未設定'})[p.level];const hint=document.createElement('p');hint.textContent=p.hint;const english=document.createElement('p');english.className='english';english.lang='en';english.textContent=p.text;english.hidden=hidden;const tip=document.createElement('p');tip.textContent=p.tip;const actions=document.createElement('div');actions.className='actions';const reveal=document.createElement('button');reveal.textContent='答えを見る';reveal.hidden=!hidden;reveal.onclick=()=>{english.hidden=false;reveal.hidden=true};const play=document.createElement('button');play.textContent='音声で聞く';play.onclick=()=>{if(!window.speakingymSpeech.speak(p.text))play.textContent='音声はこの端末で利用できません'};const del=document.createElement('button');del.textContent='保存解除';del.onclick=()=>{try{api.remove(p.id);render()}catch{del.textContent='解除できませんでした'}};actions.append(reveal,play,del);card.append(meta,hint,english,tip,actions);root.append(card)}}for(const id of ['source','category','level'])$(id).onchange=render;$('hide').onclick=()=>{hidden=!hidden;$('hide').textContent=hidden?'英語を表示':'英語を隠して復習';$('hide').setAttribute('aria-pressed',String(hidden));render()};for(const event of ['speakingym:changed','speakingym:account-ready','storage'])window.addEventListener(event,render);render()})();
</script><script type="module" src="./account-sync.js"></script></html>
