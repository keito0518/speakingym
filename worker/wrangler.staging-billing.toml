# Billing-only switch for the SAME isolated staging Worker, NEVER production.
# Opt-in after isolated staging billing D1 migration, Stripe TEST credentials and
# a dedicated Firebase tester have been provisioned. No Gemini/AI routes.
# Use ONLY: npx wrangler deploy --config wrangler.staging-billing.toml
# IMPORTANT: NEVER deploy this worker using the default wrangler.toml.
name = "speakingym-survival-ai-staging"
main = "ai-worker.js"
compatibility_date = "2026-10-14"
workers_dev = true

# Staging must not retain dashboard flags that could bypass safe defaults.
# Wrangler deployments always preserve encrypted secrets.
keep_vars = false

# Dedicated rate-limit namespaces: production uses 98101 and 98102.
[[ratelimits]]
name = "USER_LIMIT"
namespace_id = "98111"
  [ratelimits.simple]
  limit = 6
  period = 60

[[ratelimits]]
name = "GLOBAL_LIMIT"
namespace_id = "98112"
  [ratelimits.simple]
  limit = 30
  period = 60

# STAGING ONLY. Never point this binding at speakingym-plans.
[[d1_databases]]
binding = "PLAN_DB"
database_name = "speakingym-plans-staging"
database_id = "c608774e-3bc5-4527-be8d-f640e386f504"

[vars]
# Schema 0002 and 0005 were tested on this isolated staging D1.
ENFORCE_PLANS = "true"
TURN_LEDGER_MODE = "enabled"

# Later opt-in ONLY after staging migration and Stripe test-mode secrets are ready.
# Only billing endpoints and verified GET /entitlement are allowed by runtime gate.
STAGING_HEALTH_ONLY = "false"\nSTAGING_BILLING_ONLY = "true"
ALLOW_AI = "false"
FREE_SESSION_MODE = "disabled"
AI_REPLAY_MODE = "disabled"
REPLAY_CLEANUP_MODE = "disabled"
BILLING_MODE = "test"
