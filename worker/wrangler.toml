name = "speakingym-survival-ai"
main = "ai-worker.js"
compatibility_date = "2026-10-14"
workers_dev = true

# Keep dashboard-managed ALLOW_AI after Git-based code deployments.
# GEMINI_API_KEY stays in encrypted Worker secrets, never in Git.
keep_vars = true

# Conservative per-minute throttles for a public FREE-tier trial.
# The rate-limit API uses per-edge, eventually consistent counters.
[[ratelimits]]
name = "USER_LIMIT"
namespace_id = "98101"
  [ratelimits.simple]
  limit = 6
  period = 60

[[ratelimits]]
name = "GLOBAL_LIMIT"
namespace_id = "98102"
  [ratelimits.simple]
  limit = 30
  period = 60

# Future D1 Free plan-quota binding; add only after database exists:
# [[d1_databases]]
# binding = "PLAN_DB"
# database_name = "speakingym-plans"
# database_id = "REPLACE_WITH_REAL_DATABASE_UUID"
# Keep ENFORCE_PLANS unset/false until D1 migrations and binding are verified.
