name = "speakingym-survival-ai"
main = "ai-worker.js"
compatibility_date = "2026-10-14"
workers_dev = true

# Keep dashboard-managed ALLOW_AI after Git-based code deployments.
# GEMINI_API_KEY stays in encrypted Worker secrets, never in Git.
keep_vars = true

# Conservative per-minute throttles for a public FREE-tier trial.
# The rate-limit API uses per-edge, eventually consistent counters.
[[ratelimits]]
name = "USER_LIMIT"
namespace_id = "98101"
  [ratelimits.simple]
  limit = 6
  period = 60

[[ratelimits]]
name = "GLOBAL_LIMIT"
namespace_id = "98102"
  [ratelimits.simple]
  limit = 30
  period = 60

# D1 Free plan-quota binding. UUID verified from the speakingym-plans database console.
# Keeping this in Wrangler prevents a later Git-based deployment from losing PLAN_DB.
[[d1_databases]]
binding = "PLAN_DB"
database_name = "speakingym-plans"
database_id = "62419d42-703c-4e41-af47-736fd1738d7e"

# Enable server-side Free quotas: 5 AI sessions and 3 AI teacher uses per JST day.
# Requires Firebase sign-in and the bound PLAN_DB database.
# To roll back, set ENFORCE_PLANS = "false" and redeploy.
[vars]
ENFORCE_PLANS = "true"

# Worker Previews run code from feature branches, with no production bindings or keys.
# AI and billing intentionally remain OFF in this preview. Do not bind the production
# D1 database to previews. For end-to-end Stripe sandbox testing, create a distinct
# test D1 database and configure preview-only secrets/bindings separately.
# See https://developers.cloudflare.com/workers/previews/configuration/
[previews.vars]
ENFORCE_PLANS = "false"
ALLOW_AI = "false"
BILLING_MODE = "disabled"
